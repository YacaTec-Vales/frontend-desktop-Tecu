name: Deploy Staging (auto on develop merge)

on:
  pull_request:
    types: [closed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref a desplegar (default: develop HEAD)"
        required: false
        default: ""

jobs:
  deploy:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging-${{ github.repository }}
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL_S3: https://sfo3.digitaloceanspaces.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || (github.event.inputs.ref || 'develop') }}
          submodules: recursive

      - name: Clone frontend-global-styles as sibling + install deps
        if: github.repository != 'YacaTec-Vales/backend-api'
        run: |
          TARGET="$(dirname "$GITHUB_WORKSPACE")/frontend-global-styles"
          echo "Target dir: $TARGET"
          if [ ! -d "$TARGET" ]; then
            git clone --depth=1 https://github.com/YacaTec-Vales/frontend-global-styles.git "$TARGET"
            cd "$TARGET"
            npm install --no-audit --no-fund --prefer-offline
          fi
          ls -la "$TARGET/"
          ls "$TARGET/node_modules/" 2>/dev/null | head -10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install prod deps (backend only, incluye node_modules en tarball)
        if: github.repository == 'YacaTec-Vales/backend-api'
        run: npm ci --omit=dev --ignore-scripts

      - name: Configure AWS env (job-level, available for all steps)
        run: |
          echo "AWS env configured (region=${AWS_DEFAULT_REGION})"
          echo "Spaces endpoint: ${AWS_ENDPOINT_URL_S3}"

      - name: Write version.json (build sha + timestamp)
        env:
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          # IMPORTANTE: calcular SHORT_SHA AQUI. Antes se referenciaba
          # ${{ env.SHORT_SHA }} que aun no existia (Package artifact
          # lo setea en GITHUB_ENV mas tarde), escribiendo short: ""
          # en version.json y rompiendo la verificacion del deploy SSH.
          SHORT_SHA="${SHA:0:7}"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          mkdir -p version_meta
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{"sha":"%s","short":"%s","built_at":"%s","repo":"%s"}\n' \
            "$SHA" "$SHORT_SHA" "$TS" "${{ github.repository }}" \
            > version_meta/version.json
          cat version_meta/version.json

      - name: Package artifact (incluye version_meta/)
        id: package
        env:
          REPO: ${{ github.repository }}
          SHORT_SHA: ${{ env.SHORT_SHA }}
        run: |
          cd "$GITHUB_WORKSPACE"

          if [ "$REPO" = "YacaTec-Vales/backend-api" ]; then
            tar -czf /tmp/release.tar.gz \
              dist package.json package-lock.json node_modules version_meta
          else
            # Fallback hardcoded dist/<project>/browser si STAGING_DIST
            # no resuelve (algunos environments tenian el secret pero
            # bash interpolation daba vacio).
            DIST_PATH="${{ secrets.STAGING_DIST }}"
            DIST_PATH="${DIST_PATH:-dist/frontend-desktop-tecu/browser}"
            if [ -z "$DIST_PATH" ]; then
              echo "::error::STAGING_DIST no resuelve y no hay fallback para $REPO"
              exit 1
            fi
            tar -czf /tmp/release.tar.gz -C "$DIST_PATH" . -C "$GITHUB_WORKSPACE/version_meta" version_meta
          fi

          ls -lh /tmp/release.tar.gz

      - name: Upload to DO Spaces
        env:
          REPO: ${{ github.repository }}
          SHORT: ${{ env.SHORT_SHA }}
        run: |
          REPO_NAME=$(basename "$REPO")
          aws s3 cp /tmp/release.tar.gz \
            "s3://misvales-storage/staging-builds/${REPO_NAME}-${SHORT}.tar.gz" \
            --endpoint-url https://sfo3.digitaloceanspaces.com \
            --acl private
          echo "Uploaded: s3://misvales-storage/staging-builds/${REPO_NAME}-${SHORT}.tar.gz"

      - name: Generate presigned URL (1h)
        id: presign
        env:
          REPO: ${{ github.repository }}
          SHORT: ${{ env.SHORT_SHA }}
        run: |
          REPO_NAME=$(basename "$REPO")
          URL=$(aws s3 presign \
            "s3://misvales-storage/staging-builds/${REPO_NAME}-${SHORT}.tar.gz" \
            --expires-in 3600 \
            --endpoint-url https://sfo3.digitaloceanspaces.com)
          echo "ARTIFACT_URL=$URL" >> "$GITHUB_OUTPUT"
          echo "Presigned URL generated (1h TTL)"

      - name: Deploy to droplet (verifica version localmente)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          port: ${{ secrets.STAGING_PORT }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail

            ARTIFACT_URL="${{ steps.presign.outputs.ARTIFACT_URL }}"
            DEST="${{ secrets.STAGING_DEST }}"
            SHORT="${{ env.SHORT_SHA }}"

            echo "=== Deploying ${{ github.repository }} ==="
            echo "    dest=$DEST short_sha=$SHORT"
            echo "    url=${ARTIFACT_URL:0:80}..."

            # 1. Download artifact
            cd /tmp
            rm -f release.tar.gz
            curl -fsS -o release.tar.gz "$ARTIFACT_URL"
            echo "    downloaded: $(ls -lh release.tar.gz | awk '{print $5}')"

            # 2. Cleanup destination (sin rollback)
            if [ -n "$DEST" ] && [ -d "$DEST" ]; then
              find "$DEST" -mindepth 1 -delete
            else
              mkdir -p "$DEST"
            fi

            # 3. Extract
            tar -xzf release.tar.gz -C "$DEST"
            rm -f release.tar.gz

            # 3b. Sincronizar al path que sirve nginx y restaurar SELinux.
            NGINX_DEST=""
            case "$DEST" in
              /var/www/tecu/*)    NGINX_DEST="/opt/misvales/frontends/desktop/browser" ;;
              /var/www/calpix/*)  NGINX_DEST="/opt/misvales/frontends/tablet/browser" ;;
              /var/www/poch/*)    NGINX_DEST="/opt/misvales/frontends/mobile/browser" ;;
            esac
            if [ -n "$NGINX_DEST" ] && [ "$DEST" != "$NGINX_DEST" ]; then
              echo "    sync $DEST -> $NGINX_DEST (nginx path)"
              mkdir -p "$NGINX_DEST"
              find "$NGINX_DEST" -mindepth 1 -delete
              cp -a "$DEST"/. "$NGINX_DEST"/
              chown -R zombie:zombie "$NGINX_DEST" 2>/dev/null || true
              if command -v restorecon >/dev/null 2>&1; then
                restorecon -R "$NGINX_DEST" >/dev/null 2>&1 || true
              fi
            fi

            # 4. Reload nginx
            nginx -s reload
            echo "    nginx reloaded"

            # 5. Verify version on droplet
            VERSION_FILE="$NGINX_DEST/version_meta/version.json"
            if [ ! -f "$VERSION_FILE" ]; then
              echo "::error::version_meta/version.json no existe en $VERSION_FILE"
              exit 1
            fi
            DEPLOYED_SHORT=$(python3 -c "import json,sys; print(json.load(open('$VERSION_FILE'))['short'])" 2>/dev/null || grep -oP '"short":"\K[^"]+' "$VERSION_FILE" | head -1)
            if [ "$DEPLOYED_SHORT" != "$SHORT" ]; then
              echo "::error::Version mismatch: deployed=$DEPLOYED_SHORT expected=$SHORT"
              exit 1
            fi
            echo "    version verified: $DEPLOYED_SHORT"
            echo "=== Deploy OK ==="

      - name: Purge CF cache (hostnames afectados)
        if: success()
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          case "$REPO" in
            "YacaTec-Vales/backend-api")
              HOSTS='["api.taquizaschavez.com.mx","taquizaschavez.com.mx","www.taquizaschavez.com.mx"]' ;;
            "YacaTec-Vales/frontend-desktop-Tecu")
              HOSTS='["taquizaschavez.com.mx","www.taquizaschavez.com.mx"]' ;;
            "YacaTec-Vales/frontend-tablet-calipx")
              HOSTS='["calipx.taquizaschavez.com.mx"]' ;;
            "YacaTec-Vales/frontend-mobile-poch")
              HOSTS='["poch.taquizaschavez.com.mx"]' ;;
            *)
              echo "::error::Repositorio sin mapeo de purge: $REPO"
              exit 1
              ;;
          esac

          RESP=$(curl -sS -X GET \
            "https://api.cloudflare.com/client/v4/zones?name=taquizaschavez.com.mx" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json")
          OK=$(echo "$RESP" | jq -r '.success')
          if [ "$OK" != "true" ]; then
            echo "::error::No se pudo listar la zona: $RESP"
            exit 1
          fi
          ZID=$(echo "$RESP" | jq -r '.result[0].id')
          if [ -z "$ZID" ] || [ "$ZID" = "null" ]; then
            echo "::error::Zona taquizaschavez.com.mx no encontrada"
            exit 1
          fi
          echo "Zone id: $ZID"

          RESP=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${ZID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"hosts\":${HOSTS}}")
          echo "$RESP" | jq .
          if [ "$(echo "$RESP" | jq -r '.success')" = "true" ]; then
            echo "CF cache purged for hosts: $HOSTS"
          else
            echo "::error::Purge fallo"
            exit 1
          fi

      - name: Delete tarball from Spaces (cero retencion)
        if: success()
        env:
          REPO: ${{ github.repository }}
          SHORT: ${{ env.SHORT_SHA }}
        run: |
          REPO_NAME=$(basename "$REPO")
          aws s3 rm "s3://misvales-storage/staging-builds/${REPO_NAME}-${SHORT}.tar.gz" \
            --endpoint-url https://sfo3.digitaloceanspaces.com || true
          echo "Tarball borrado de Spaces (cero retencion)"

      - name: Summary
        if: always()
        run: |
          echo "### Deploy Staging Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Repository**: ${{ github.repository }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Merge commit**: \`${{ github.event.pull_request.merge_commit_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Short SHA**: \`${{ env.SHORT_SHA }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Result**: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Destino**: \`${{ secrets.STAGING_DEST }}\`" >> "$GITHUB_STEP_SUMMARY"