name: Release

# Se lanza DESPUES de que "Auto Release" (semantic-release) termina,
# para usar la version CALCULADA (ej. v0.1.1-rc.1) y no el numero que
# se ponga a mano en el nombre de la rama release/v*.
on:
  workflow_run:
    workflows: ["Auto Release"]
    types:
      - completed
    branches:
      - 'release/**'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: YacaTec-Vales/frontend-desktop-Tecu
          ref: ${{ github.event.workflow_run.head_branch }}
          path: frontend-desktop-tecu
          fetch-depth: 0

      - name: Checkout frontend-global-styles (sibling)
        uses: actions/checkout@v4
        with:
          repository: YacaTec-Vales/frontend-global-styles
          path: frontend-global-styles

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-desktop-tecu/package-lock.json

      - name: Dependencias de frontend-global-styles
        working-directory: frontend-global-styles
        run: npm ci

      - name: Instalar dependencias
        working-directory: frontend-desktop-tecu
        run: npm ci

      - name: Build
        working-directory: frontend-desktop-tecu
        run: npm run build

      - name: Obtener version de la release generada por semantic-release
        working-directory: frontend-desktop-tecu
        run: |
          TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [[ -z "${TAG}" ]]; then
            TAG="${WORKFLOW_BRANCH#release/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_ENV"
        env:
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}

      - name: Empaquetar artefacto (dist/browser)
        run: |
          mkdir -p /tmp/release
          tar -czf "/tmp/release/frontend-desktop-tecu-${tag}.tar.gz" \
            -C frontend-desktop-tecu/dist/frontend-desktop-tecu/browser .
          echo "asset=frontend-desktop-tecu-${tag}.tar.gz" >> "$GITHUB_ENV"

      - name: Crear release con artefacto (prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} ya existe, se omite."
          else
            gh release create "${tag}" "/tmp/release/${asset}" \
              --prerelease --title "${tag}" --notes "Artefacto de la prerelease ${tag}"
          fi
