<div class="bg-white border border-gray-200 rounded-xl shadow-sm dark:bg-gray-800 dark:border-gray-700 h-full flex flex-col transition-shadow hover:shadow-md {{ extraClasses }}">
  <div *ngIf="title || subtitle" class="px-6 py-5 border-b border-gray-100 dark:border-gray-700">
    <h3 *ngIf="title" class="text-lg font-bold text-gray-900 dark:text-white">{{ title }}</h3>
    <p *ngIf="subtitle" class="mt-1 text-sm text-gray-500 dark:text-gray-400">{{ subtitle }}</p>
  </div>
  
  <div class="flex-grow w-full" [ngClass]="{'p-6': !noPadding}">
    <ng-content></ng-content>
  </div>
</div>
