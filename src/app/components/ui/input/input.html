<div class="w-full">
  <label *ngIf="label" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
    {{ label }}
  </label>

  <ng-container [ngSwitch]="type">
    
    <!-- Textarea -->
    <textarea
      *ngSwitchCase="'textarea'"
      [rows]="rows"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [value]="value"
      [attr.maxlength]="maxlength"
      (input)="onInput($event)"
      (blur)="onTouch()"
      [class]="baseInputClasses"
    ></textarea>

    <!-- File Input (Desktop optimized) -->
    <div *ngSwitchCase="'file'" class="flex items-center justify-center w-full">
      <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 dark:hover:bg-bray-800 dark:bg-gray-700 hover:bg-gray-100 dark:border-gray-600 dark:hover:border-gray-500 dark:hover:bg-gray-600 transition-colors" [class.opacity-50]="disabled" [class.cursor-not-allowed]="disabled">
        <div class="flex flex-col items-center justify-center pt-5 pb-6">
          <svg class="w-8 h-8 mb-3 text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
          </svg>
          <p class="mb-1 text-sm text-gray-500 dark:text-gray-400"><span class="font-semibold">Haz clic para subir</span> o arrastra y suelta</p>
          <p class="text-xs text-gray-500 dark:text-gray-400">Archivos permitidos: Excel, PDF o Imágenes</p>
          <p *ngIf="value?.name" class="mt-2 text-sm font-bold text-brand dark:text-brand-light">Archivo seleccionado: {{ value.name }}</p>
        </div>
        <input type="file" class="hidden" [accept]="accept" [disabled]="disabled" (change)="onInput($event)" />
      </label>
    </div>

    <!-- Date Input (Desktop forms heavy reliance) -->
    <input
      *ngSwitchCase="'date'"
      type="date"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [value]="value"
      [attr.maxlength]="maxlength"
      (input)="onInput($event)"
      (blur)="onTouch()"
      [class]="baseInputClasses"
    />

    <!-- Standard Inputs -->
    <input
      *ngSwitchDefault
      [type]="type"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [value]="value"
      [attr.maxlength]="maxlength"
      (input)="onInput($event)"
      (blur)="onTouch()"
      [class]="baseInputClasses"
    />

  </ng-container>

  <p *ngIf="hint" class="mt-1.5 text-xs text-gray-500 dark:text-gray-400">{{ hint }}</p>
</div>
