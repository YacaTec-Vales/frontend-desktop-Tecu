<div class="relative overflow-x-auto w-full">

  <!-- Header / Acciones Globales -->
  <div
    class="p-6 pb-4 flex flex-col md:flex-row items-center justify-between gap-4 border-b border-gray-100 dark:border-gray-700"
    *ngIf="title || subtitle">
    <div>
      <h2 *ngIf="title" class="text-xl font-bold text-gray-900 dark:text-white">{{ title }}</h2>
      <p *ngIf="subtitle" class="text-sm text-gray-500 dark:text-gray-400 mt-1">{{ subtitle }}</p>
    </div>

    <div class="flex items-center gap-2">
      <!-- Búsqueda -->
      <div class="flex items-center gap-2">
        <input *ngIf="isSearchVisible" type="text" placeholder="Buscar en tabla..."
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-brand focus:border-brand block p-2"
          (input)="onSearchInput($event)" />
        <app-button variant="primary" (onClick)="isSearchVisible = !isSearchVisible" title="Buscar">
          <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-width="2"
              d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
          </svg>
        </app-button>
      </div>

      <!-- Exportar -->
      <app-button variant="success" (onClick)="isExportModalOpen = true" title="Exportar">
        <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 10V4a1 1 0 0 0-1-1H9.914a1 1 0 0 0-.707.293L5.293 7.207A1 1 0 0 0 5 7.914V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2M10 3v4a1 1 0 0 1-1 1H5m5 6h9m0 0-2-2m2 2-2 2" />
        </svg>
      </app-button>

      <!-- Botones Inyectados por el Padre -->
      <ng-content select="[table-actions]"></ng-content>
    </div>
  </div>

  <div (click)="onTableClick($event)" [class.show-column-filters]="isSearchVisible">
    <table #tableEl class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
      <thead
        class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400 border-b border-gray-200 dark:border-gray-600">
        <tr>
          <th *ngFor="let col of columns" scope="col" class="px-6 py-3 whitespace-nowrap">
            {{ col }}
          </th>
        </tr>
      </thead>

      <tbody *ngIf="!isEmpty">
        <ng-content></ng-content>
      </tbody>
    </table>
  </div>

  <!-- Empty State (Desktop) -->
  <div *ngIf="isEmpty" class="flex flex-col items-center justify-center py-12 text-center bg-white dark:bg-gray-800">
    <div class="p-3 mb-4 rounded-full bg-gray-100 dark:bg-gray-700">
      <svg class="w-8 h-8 text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
        viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
      </svg>
    </div>
    <h3 class="mb-1 text-base font-bold text-gray-900 dark:text-white">Sin Registros</h3>
    <p class="text-sm text-gray-500 dark:text-gray-400">{{ emptyMessage }}</p>
  </div>
</div>

<!-- Modal Exportar -->
<app-modal [isOpen]="isExportModalOpen" title="Exportar Tabla" maxWidth="sm" (onClose)="isExportModalOpen = false">
  <div class="space-y-4">
    <p class="text-sm text-gray-500 dark:text-gray-400">Selecciona el formato en el que deseas descargar la información
      actual de la tabla.</p>

    <div class="flex flex-col gap-3">
      <button (click)="exportarDatos('csv')"
        class="flex items-center justify-center gap-2 p-3 text-sm font-medium text-gray-900 bg-white border border-gray-200 rounded-lg hover:bg-gray-100 hover:text-brand focus:z-10 focus:ring-2 focus:ring-brand dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:hover:text-white dark:hover:bg-gray-600">
        <svg class="w-5 h-5 text-green-600" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 10V4a1 1 0 0 0-1-1H9.914a1 1 0 0 0-.707.293L5.293 7.207A1 1 0 0 0 5 7.914V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2M10 3v4a1 1 0 0 1-1 1H5m5 6h9m0 0-2-2m2 2-2 2" />
        </svg>
        Descargar CSV (Excel)
      </button>

      <button (click)="exportarDatos('pdf')"
        class="flex items-center justify-center gap-2 p-3 text-sm font-medium text-gray-900 bg-white border border-gray-200 rounded-lg hover:bg-gray-100 hover:text-brand focus:z-10 focus:ring-2 focus:ring-brand dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:hover:text-white dark:hover:bg-gray-600">
        <svg class="w-5 h-5 text-red-600" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M5 17v-5h1.5a1.5 1.5 0 1 1 0 3H5m12 2v-5h2m-2 3h2M5 10V7.914a1 1 0 0 1 .293-.707l3.914-3.914A1 1 0 0 1 9.914 3H18a1 1 0 0 1 1 1v6M5 19v1a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1M10 3v4a1 1 0 0 1-1 1H5m2.665 9H6.647A1.647 1.647 0 0 1 5 15.353v-1.706A1.647 1.647 0 0 1 6.647 12h1.018M16 12l1.443 4.773L19 12m-6.05 4h1.018a1.647 1.647 0 0 0 1.647-1.647v-1.706A1.647 1.647 0 0 0 13.968 12H12.95" />
        </svg>
        Imprimir PDF
      </button>
    </div>

    <div class="mt-4 flex justify-end">
      <app-button variant="text" (onClick)="isExportModalOpen = false">Cerrar</app-button>
    </div>
  </div>
</app-modal>
