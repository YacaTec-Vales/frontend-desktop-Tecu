<div class="relative overflow-x-auto w-full">
  <table class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
    <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400 border-b border-gray-200 dark:border-gray-600">
      <tr>
        <th *ngFor="let col of columns" scope="col" class="px-6 py-3 whitespace-nowrap">
          {{ col }}
        </th>
      </tr>
    </thead>
    
    <tbody *ngIf="!isEmpty">
      <ng-content></ng-content>
    </tbody>
  </table>

  <!-- Empty State (Desktop) -->
  <div *ngIf="isEmpty" class="flex flex-col items-center justify-center py-12 text-center bg-white dark:bg-gray-800">
    <div class="p-3 mb-4 rounded-full bg-gray-100 dark:bg-gray-700">
      <svg class="w-8 h-8 text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
      </svg>
    </div>
    <h3 class="mb-1 text-base font-bold text-gray-900 dark:text-white">Sin Registros</h3>
    <p class="text-sm text-gray-500 dark:text-gray-400">{{ emptyMessage }}</p>
  </div>
</div>
