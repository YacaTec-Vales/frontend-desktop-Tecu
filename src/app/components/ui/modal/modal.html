<div *ngIf="isOpen" class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
  
  <!-- Backdrop oscuro -->
  <div class="fixed inset-0 bg-gray-900/50 dark:bg-gray-900/80 transition-opacity" aria-hidden="true" (click)="close()"></div>

  <!-- Contenedor centrado -->
  <div class="flex min-h-screen items-center justify-center p-4 text-center sm:p-0 pointer-events-none">
    
    <!-- Modal Dialog -->
    <div 
      class="relative transform overflow-hidden rounded-xl bg-white text-left shadow-xl transition-all sm:my-8 w-full pointer-events-auto dark:bg-gray-800 border dark:border-gray-700 {{ widthClass }}"
      (click)="stopPropagation($event)">
      
      <!-- Header -->
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100 dark:border-gray-700">
        <h3 class="text-lg font-bold text-gray-900 dark:text-white" id="modal-title">
          {{ title }}
        </h3>
        
        <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ml-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white" (click)="close()">
          <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
          </svg>
          <span class="sr-only">Cerrar modal</span>
        </button>
      </div>
      
      <!-- Body -->
      <div class="px-6 py-4">
        <ng-content></ng-content>
      </div>

    </div>
  </div>
</div>
