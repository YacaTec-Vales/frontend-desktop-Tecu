<div class="antialiased bg-gray-50 dark:bg-gray-900 h-screen font-sans flex overflow-hidden">
  
  <!-- Sidebar -->
  <aside [class.w-64]="isSidebarOpen" [class.w-24]="!isSidebarOpen" class="flex-shrink-0 h-screen bg-white border-r border-gray-200 dark:bg-gray-800 dark:border-gray-700 flex flex-col z-40 transition-all duration-300 ease-in-out" aria-label="Sidenav">
    <div class="overflow-y-auto py-5 h-full flex flex-col">
      <div class="mb-10 flex items-center justify-between cursor-pointer px-3 group" (click)="toggleSidebar()" title="Desplegar/Ocultar Menú">
          <div class="flex items-center">
            <img src="Group 9.svg" class="w-10 h-10 object-contain flex-shrink-0" alt="Logo" />
            <span *ngIf="isSidebarOpen" class="ml-3 text-xl font-bold whitespace-nowrap text-brand dark:text-brand-light transition-opacity duration-300">Admin Panel</span>
          </div>
          <!-- Chevron Indicator -->
          <div class="p-1 rounded-md bg-gray-100 hover:bg-gray-200 text-gray-500 transition-colors">
            <svg *ngIf="isSidebarOpen" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            <svg *ngIf="!isSidebarOpen" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
          </div>
      </div>
      
      <ul class="space-y-2 flex-1 px-3">
        <li>
          <a routerLink="/admin/punto-atencion" routerLinkActive="bg-gray-100 dark:bg-gray-700" [title]="!isSidebarOpen ? 'Punto de Atención' : ''" class="flex items-center p-2 text-base font-medium text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group transition-colors overflow-hidden">
            <svg aria-hidden="true" class="w-6 h-6 flex-shrink-0 text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-brand dark:group-hover:text-white" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 10a8 8 0 018-8v8h8a8 8 0 11-16 0z"></path>
              <path d="M12 2.252A8.014 8.014 0 0117.748 8H12V2.252z"></path>
            </svg>
            <span *ngIf="isSidebarOpen" class="ml-3 whitespace-nowrap">Punto de Atención</span>
          </a>
        </li>
        <li>
          <a routerLink="/admin/caja-dispersion" routerLinkActive="bg-gray-100 dark:bg-gray-700" [title]="!isSidebarOpen ? 'Caja (Dispersión)' : ''" class="flex items-center p-2 text-base font-medium text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group transition-colors overflow-hidden">
            <svg aria-hidden="true" class="flex-shrink-0 w-6 h-6 text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-brand dark:group-hover:text-white" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd" d="M10 2a4 4 0 00-4 4v1H5a1 1 0 00-.994.89l-1 9A1 1 0 004 18h12a1 1 0 00.994-1.11l-1-9A1 1 0 0015 7h-1V6a4 4 0 00-4-4zm2 5V6a2 2 0 10-4 0v1h4zm-6 3a1 1 0 112 0 1 1 0 01-2 0zm7-1a1 1 0 100 2 1 1 0 000-2z" clip-rule="evenodd"></path>
            </svg>
            <span *ngIf="isSidebarOpen" class="ml-3 whitespace-nowrap">Caja (Dispersión)</span>
          </a>
        </li>
        <li>
          <a routerLink="/admin/carga-archivos" routerLinkActive="bg-gray-100 dark:bg-gray-700" [title]="!isSidebarOpen ? 'Carga Banco' : ''" class="flex items-center p-2 text-base font-medium text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group transition-colors overflow-hidden">
            <svg aria-hidden="true" class="flex-shrink-0 w-6 h-6 text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-brand dark:group-hover:text-white" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 6.707a1 1 0 010-1.414l3-3a1 1 0 011.414 0l3 3a1 1 0 01-1.414 1.414L11 5.414V13a1 1 0 11-2 0V5.414L7.707 6.707a1 1 0 01-1.414 0z" clip-rule="evenodd"></path>
            </svg>
            <span *ngIf="isSidebarOpen" class="ml-3 whitespace-nowrap">Carga Banco</span>
          </a>
        </li>
        <li>
          <a routerLink="/admin/conciliacion" routerLinkActive="bg-gray-100 dark:bg-gray-700" [title]="!isSidebarOpen ? 'Conciliación' : ''" class="flex items-center p-2 text-base font-medium text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group transition-colors overflow-hidden">
            <svg aria-hidden="true" class="flex-shrink-0 w-6 h-6 text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-brand dark:group-hover:text-white" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"></path>
            </svg>
            <span *ngIf="isSidebarOpen" class="ml-3 whitespace-nowrap">Conciliación</span>
          </a>
        </li>
        <li>
          <a routerLink="/admin/tokens" routerLinkActive="bg-gray-100 dark:bg-gray-700" [title]="!isSidebarOpen ? 'Módulo Tokens' : ''" class="flex items-center p-2 text-base font-medium text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group transition-colors overflow-hidden">
            <svg aria-hidden="true" class="flex-shrink-0 w-6 h-6 text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-brand dark:group-hover:text-white" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path>
            </svg>
            <span *ngIf="isSidebarOpen" class="ml-3 whitespace-nowrap">Módulo Tokens</span>
          </a>
        </li>
      </ul>
      
      <!-- User Profile / Logout -->
      <ul class="space-y-2 mt-4 pt-4 border-t border-gray-200 dark:border-gray-700 px-3">
        <li>
          <a routerLink="/login" [title]="!isSidebarOpen ? 'Cerrar Sesión' : ''" class="flex items-center p-2 text-base font-medium text-gray-900 rounded-lg dark:text-white hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-900 dark:hover:text-red-400 group transition-colors overflow-hidden">
            <svg aria-hidden="true" class="flex-shrink-0 w-6 h-6 text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-red-600 dark:group-hover:text-red-400" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd"></path>
            </svg>
            <span *ngIf="isSidebarOpen" class="ml-3 whitespace-nowrap">Cerrar Sesión</span>
          </a>
        </li>
      </ul>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <main class="flex-1 w-full h-full flex flex-col bg-gray-50 dark:bg-gray-900 overflow-y-auto min-w-0 transition-all">
    <div class="p-4 md:p-8">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
