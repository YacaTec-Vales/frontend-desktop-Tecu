<div class="max-w-4xl mx-auto space-y-6 pb-12">
  <div class="mb-8 border-b border-gray-200 pb-4">
    <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white tracking-tight">Motor de Reglas y Configuración</h1>
    <p class="text-gray-500 dark:text-gray-400 mt-2 text-lg">Establezca los parámetros matemáticos que rigen toda la financiera.</p>
  </div>

  <form class="space-y-8">
    
    <!-- Sección de Tasas -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 dark:bg-gray-800 dark:border-gray-700 overflow-hidden">
      <div class="bg-gray-50 px-6 py-4 border-b border-gray-200 dark:bg-gray-700 dark:border-gray-600">
        <h2 class="text-lg font-bold text-gray-900 dark:text-white">Tasas y Comisiones</h2>
      </div>
      <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Tasa de Interés Base (Quincenal)</label>
          <div class="flex relative">
            <input type="number" class="rounded-none rounded-s-lg bg-gray-50 border border-gray-300 text-gray-900 focus:ring-brand focus:border-brand block flex-1 min-w-0 w-full text-sm p-2.5" value="12">
            <span class="inline-flex items-center px-3 text-sm text-gray-900 bg-gray-200 border border-s-0 border-gray-300 rounded-e-md">%</span>
          </div>
        </div>
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Interés Moratorio (Diario)</label>
          <div class="flex relative">
            <input type="number" class="rounded-none rounded-s-lg bg-gray-50 border border-gray-300 text-gray-900 focus:ring-brand focus:border-brand block flex-1 min-w-0 w-full text-sm p-2.5" value="1.5">
            <span class="inline-flex items-center px-3 text-sm text-gray-900 bg-gray-200 border border-s-0 border-gray-300 rounded-e-md">%</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Sección de Ciclos -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 dark:bg-gray-800 dark:border-gray-700 overflow-hidden">
      <div class="bg-gray-50 px-6 py-4 border-b border-gray-200 dark:bg-gray-700 dark:border-gray-600">
        <h2 class="text-lg font-bold text-gray-900 dark:text-white">Ciclos de Facturación</h2>
      </div>
      <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Día de Corte (1ra Quincena)</label>
          <select class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-brand focus:border-brand block w-full p-2.5">
            <option>10</option>
            <option selected>12</option>
            <option>15</option>
          </select>
        </div>
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Día de Pago (1ra Quincena)</label>
          <select class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-brand focus:border-brand block w-full p-2.5">
            <option>15</option>
            <option selected>17</option>
            <option>20</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Botones -->
    <div class="flex justify-end gap-4 border-t border-gray-200 pt-6">
      <button type="button" class="px-5 py-2.5 text-sm font-medium text-gray-900 bg-white rounded-lg border border-gray-200 hover:bg-gray-100 focus:ring-4 focus:ring-gray-100">
        Restaurar Valores
      </button>
      <button type="button" class="px-5 py-2.5 text-sm font-bold text-white rounded-lg shadow-sm hover:opacity-90" style="background-color: #600C0C;">
        Guardar Configuración Global
      </button>
    </div>

  </form>

</div>
