<div class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold tracking-tight">Configuración Global de Negocio</h2>
    <p class="text-sm text-brand-secondary mt-1">
      Modifica los parámetros financieros maestros que rigen los cálculos en todas las sucursales.
    </p>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="flex justify-center p-12">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-brand-primary"></div>
  </div>

  <!-- Error State -->
  <div *ngIf="errorMessage" class="bg-red-50 text-red-600 p-4 rounded-md">
    {{ errorMessage }}
  </div>

  <div *ngIf="successMessage" class="bg-green-50 text-green-600 p-4 rounded-md">
    {{ successMessage }}
  </div>

  <div *ngIf="!isLoading" class="grid grid-cols-1 md:grid-cols-2 gap-6">
    
    <!-- Parámetros Financieros (Vales) -->
    <app-card title="Parámetros de Vales y Cobranza" subtitle="Seguros, intereses y multas">
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Costo del Seguro por Vale ($ MXN)</label>
          <app-input type="number" [(ngModel)]="insurancePesos" placeholder="Ej. 100"></app-input>
        </div>
        
        <div>
          <label class="block text-sm font-medium mb-1">Interés por Quincena (%)</label>
          <app-input type="number" [(ngModel)]="interestPercent" placeholder="Ej. 5"></app-input>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Multa por Mora / Pago Tardío ($ MXN)</label>
          <app-input type="number" [(ngModel)]="latePenaltyPesos" placeholder="Ej. 300"></app-input>
        </div>
      </div>
    </app-card>

    <!-- Parámetros de Puntos -->
    <app-card title="Sistema de Puntos" subtitle="Cálculo de recompensas a distribuidores">
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Monto para obtener puntos (Divisor $ MXN)</label>
          <p class="text-xs text-gray-500 mb-1">Se da un tramo de puntos por cada X pesos pagados.</p>
          <app-input type="number" [(ngModel)]="pointsDivisorPesos" placeholder="Ej. 1200"></app-input>
        </div>
        
        <div>
          <label class="block text-sm font-medium mb-1">Multiplicador de Puntos (%)</label>
          <app-input type="number" [(ngModel)]="pointsMultiplierPercent" placeholder="Ej. 3"></app-input>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Valor en efectivo por Punto ($ MXN)</label>
          <app-input type="number" [(ngModel)]="pointsValuePesos" placeholder="Ej. 2"></app-input>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Penalización de Puntos por Mora (%)</label>
          <app-input type="number" [(ngModel)]="pointsLatePenaltyPercent" placeholder="Ej. 20"></app-input>
        </div>
      </div>
    </app-card>

  </div>

  <div *ngIf="!isLoading" class="flex justify-end gap-3 mt-6">
    <app-button variant="outline" (click)="loadConfig()">
      Descartar Cambios
    </app-button>
    <app-button *vpnOnly
      variant="primary"
      (click)="guardarConfiguracion()"
      [disabled]="isSaving">
      {{ isSaving ? 'Guardando...' : 'Guardar Configuración' }}
    </app-button>
  </div>
</div>
