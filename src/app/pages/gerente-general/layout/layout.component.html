<div class="antialiased bg-gray-100 dark:bg-gray-900 h-screen font-sans flex overflow-hidden">
  
  <!-- Sidebar Executive (Dark) -->
  <aside [class.w-64]="isSidebarOpen" [class.w-24]="!isSidebarOpen" class="flex-shrink-0 h-screen bg-gray-900 border-r border-gray-800 flex flex-col z-40 transition-all duration-300 ease-in-out" aria-label="Sidenav">
    <div class="overflow-y-auto py-5 h-full flex flex-col">
      <div class="mb-10 flex items-center justify-between cursor-pointer px-3 group" (click)="toggleSidebar()" title="Desplegar/Ocultar Menú">
          <div class="flex items-center">
            <!-- Logo invertido o mismo logo -->
            <img src="Group 9.svg" class="w-10 h-10 object-contain flex-shrink-0 bg-white rounded-full p-1" alt="Logo" />
            <span *ngIf="isSidebarOpen" class="ml-3 text-xl font-bold whitespace-nowrap text-white transition-opacity duration-300">Corporativo</span>
          </div>
          <div class="p-1 rounded-md bg-gray-800 hover:bg-gray-700 text-gray-400 transition-colors">
            <svg *ngIf="isSidebarOpen" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            <svg *ngIf="!isSidebarOpen" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
          </div>
      </div>
      
      <ul class="space-y-2 flex-1 px-3 text-gray-300">
        <li>
          <a routerLink="/gerente-general/panel-corporativo" routerLinkActive="bg-gray-800 text-white" [title]="!isSidebarOpen ? 'Panel Global' : ''" class="flex items-center p-2 text-base font-medium rounded-lg hover:bg-gray-800 hover:text-white group transition-colors overflow-hidden">
            <svg class="w-6 h-6 flex-shrink-0 text-gray-400 transition duration-75 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span *ngIf="isSidebarOpen" class="ml-3 whitespace-nowrap">Panel Global</span>
          </a>
        </li>
        <li>
          <a routerLink="/gerente-general/motor-reglas" routerLinkActive="bg-gray-800 text-white" [title]="!isSidebarOpen ? 'Motor de Reglas' : ''" class="flex items-center p-2 text-base font-medium rounded-lg hover:bg-gray-800 hover:text-white group transition-colors overflow-hidden">
            <svg class="w-6 h-6 flex-shrink-0 text-gray-400 transition duration-75 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <span *ngIf="isSidebarOpen" class="ml-3 whitespace-nowrap">Motor de Reglas</span>
          </a>
        </li>
        <li>
          <a routerLink="/gerente-general/catalogo" routerLinkActive="bg-gray-800 text-white" [title]="!isSidebarOpen ? 'Catálogo de Vales' : ''" class="flex items-center p-2 text-base font-medium rounded-lg hover:bg-gray-800 hover:text-white group transition-colors overflow-hidden">
            <svg class="w-6 h-6 flex-shrink-0 text-gray-400 transition duration-75 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            <span *ngIf="isSidebarOpen" class="ml-3 whitespace-nowrap">Catálogo de Vales</span>
          </a>
        </li>
        <li>
          <a routerLink="/gerente-general/autorizaciones" routerLinkActive="bg-gray-800 text-white" [title]="!isSidebarOpen ? 'Auth Maestra' : ''" class="flex items-center p-2 text-base font-medium rounded-lg hover:bg-gray-800 hover:text-white group transition-colors overflow-hidden">
            <svg class="w-6 h-6 flex-shrink-0 text-gray-400 transition duration-75 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            <span *ngIf="isSidebarOpen" class="ml-3 whitespace-nowrap">Auth Maestra</span>
          </a>
        </li>
        <li>
          <a routerLink="/gerente-general/auditoria" routerLinkActive="bg-gray-800 text-white" [title]="!isSidebarOpen ? 'Auditoría' : ''" class="flex items-center p-2 text-base font-medium rounded-lg hover:bg-gray-800 hover:text-white group transition-colors overflow-hidden">
            <svg class="w-6 h-6 flex-shrink-0 text-gray-400 transition duration-75 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
            <span *ngIf="isSidebarOpen" class="ml-3 whitespace-nowrap">Visor Auditoría</span>
          </a>
        </li>
      </ul>
      
      <!-- Logout -->
      <ul class="space-y-2 mt-4 pt-4 border-t border-gray-800 px-3 text-gray-300">
        <li>
          <a routerLink="/login" [title]="!isSidebarOpen ? 'Cerrar Sesión' : ''" class="flex items-center p-2 text-base font-medium rounded-lg hover:bg-red-900 hover:text-red-300 group transition-colors overflow-hidden">
            <svg class="flex-shrink-0 w-6 h-6 text-gray-400 group-hover:text-red-300 transition duration-75" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd"></path></svg>
            <span *ngIf="isSidebarOpen" class="ml-3 whitespace-nowrap">Cerrar Sesión</span>
          </a>
        </li>
      </ul>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <main class="flex-1 w-full h-full flex flex-col bg-gray-100 dark:bg-gray-900 overflow-y-auto min-w-0 transition-all">
    <div class="p-4 md:p-8">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
