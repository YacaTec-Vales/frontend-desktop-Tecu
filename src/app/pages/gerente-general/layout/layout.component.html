<div class="antialiased bg-gray-50 dark:bg-gray-900 h-screen font-sans flex overflow-hidden">
<app-desktop-only-banner></app-desktop-only-banner>

  <!-- Sidebar -->
  <aside [class.w-64]="isSidebarOpen" [class.w-20]="!isSidebarOpen"
    class="flex-shrink-0 h-screen bg-white border-r border-gray-200 dark:bg-gray-800 dark:border-gray-700 flex flex-col z-40 transition-all duration-300 ease-in-out">
    <div class="flex flex-col h-full py-5 px-3">

      <!-- Brand -->
      <div class="mb-8 flex items-center justify-between cursor-pointer px-2" (click)="toggleSidebar()">
        <div class="flex items-center gap-3 overflow-hidden">
          <div
            class="w-10 h-10 bg-brand rounded-lg flex items-center justify-center text-white shrink-0 font-bold text-xl">
            Y
          </div>
          <span *ngIf="isSidebarOpen"
            class="text-xl font-black text-brand tracking-tight whitespace-nowrap">Matriz</span>
        </div>
      </div>

      <!-- Navigation -->
      <ul class="space-y-2 flex-1">
        <li>
          <a routerLink="/gerente-general/catalogos"
            routerLinkActive="bg-brand-50 text-brand font-bold dark:bg-gray-700 dark:text-white"
            class="flex items-center p-3 text-base font-medium text-gray-700 rounded-lg hover:bg-gray-100 transition-colors group overflow-hidden">
            <svg class="w-6 h-6 shrink-0 transition-colors group-hover:text-brand" fill="none" stroke="currentColor"
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z">
              </path>
            </svg>
            <span *ngIf="isSidebarOpen" class="ml-4 whitespace-nowrap">Catálogos Maestros</span>
          </a>
        </li>
        <li>
          <a routerLink="/gerente-general/aprobaciones"
            routerLinkActive="bg-brand-50 text-brand font-bold dark:bg-gray-700 dark:text-white"
            class="flex items-center p-3 text-base font-medium text-gray-700 rounded-lg hover:bg-gray-100 transition-colors group overflow-hidden">
            <svg class="w-6 h-6 min-w-[24px] text-gray-500 transition duration-75 group-hover:text-gray-900"
              aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span *ngIf="isSidebarOpen"
              class="ml-3 truncate whitespace-nowrap transition-opacity duration-300">Aprobaciones</span>
          </a>
        </li>

        <li>
          <a routerLink="/gerente-general/autorizaciones"
            routerLinkActive="bg-brand-50 text-brand font-bold dark:bg-gray-700 dark:text-white"
            class="flex items-center p-3 text-base font-medium text-gray-700 rounded-lg hover:bg-gray-100 transition-colors group overflow-hidden">
            <svg class="w-6 h-6 min-w-[24px] text-gray-500 transition duration-75 group-hover:text-gray-900"
              aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
            </svg>
            <span *ngIf="isSidebarOpen"
              class="ml-3 truncate whitespace-nowrap transition-opacity duration-300">Autorizaciones</span>
          </a>
        </li>

        <li>
          <a routerLink="/gerente-general/distribuidoras"
            routerLinkActive="bg-brand-50 text-brand font-bold dark:bg-gray-700 dark:text-white"
            class="flex items-center p-3 text-base font-medium text-gray-700 rounded-lg hover:bg-gray-100 transition-colors group overflow-hidden">
            <svg class="w-6 h-6 min-w-[24px] text-gray-500 transition duration-75 group-hover:text-gray-900"
              aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <span *ngIf="isSidebarOpen"
              class="ml-3 truncate whitespace-nowrap transition-opacity duration-300">Distribuidoras</span>
          </a>
        </li>

        <li>
          <a routerLink="/gerente-general/relaciones"
            routerLinkActive="bg-brand-50 text-brand font-bold dark:bg-gray-700 dark:text-white"
            class="flex items-center p-3 text-base font-medium text-gray-700 rounded-lg hover:bg-gray-100 transition-colors group overflow-hidden">
            <svg class="w-6 h-6 min-w-[24px] text-gray-500 transition duration-75 group-hover:text-gray-900"
              aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
            </svg>
            <span *ngIf="isSidebarOpen"
              class="ml-3 truncate whitespace-nowrap transition-opacity duration-300">Relaciones de Pago</span>
          </a>
        </li>
        <li>
          <a routerLink="/gerente-general/corte-quincena"
            routerLinkActive="bg-brand-50 text-brand font-bold dark:bg-gray-700 dark:text-white"
            class="flex items-center p-3 text-base font-medium text-gray-700 rounded-lg hover:bg-gray-100 transition-colors group overflow-hidden">
            <svg class="w-6 h-6 shrink-0 transition-colors group-hover:text-brand" fill="none" stroke="currentColor"
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z">
              </path>
            </svg>
            <span *ngIf="isSidebarOpen" class="ml-4 whitespace-nowrap">Corte de Quincena</span>
          </a>
        </li>
      </ul>

      <!-- Footer / Profile -->
      <div class="mt-auto border-t border-gray-200 pt-4">
        <a (click)="logout()"
          class="cursor-pointer flex items-center p-3 text-base font-medium text-red-600 rounded-lg hover:bg-red-50 transition-colors overflow-hidden">
          <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
          </svg>
          <span *ngIf="isSidebarOpen" class="ml-4 font-bold">Cerrar Sesión</span>
        </a>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto bg-gray-50 dark:bg-gray-900 w-full relative h-screen">
    <!-- VPN indicator (top-right corner) -->
    <div class="absolute top-4 right-6 z-30">
      <app-vpn-indicator></app-vpn-indicator>
    </div>
    <!-- Banner de solo lectura cuando NO-VPN -->
    <app-vpn-readonly-banner></app-vpn-readonly-banner>
    <div class="p-8">
      <router-outlet></router-outlet>
    </div>
  </main>

</div>
