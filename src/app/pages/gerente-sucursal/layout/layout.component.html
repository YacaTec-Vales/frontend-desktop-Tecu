<div class="antialiased bg-gray-50 dark:bg-gray-900 h-screen font-sans flex overflow-hidden">
  
  <!-- Sidebar -->
  <aside [class.w-64]="isSidebarOpen" [class.w-20]="!isSidebarOpen" class="flex-shrink-0 h-screen bg-white border-r border-gray-200 dark:bg-gray-800 dark:border-gray-700 flex flex-col z-40 transition-all duration-300 ease-in-out">
    <div class="flex flex-col h-full py-5 px-3">
      
      <!-- Brand -->
      <div class="mb-8 flex items-center justify-between cursor-pointer px-2" (click)="toggleSidebar()">
        <div class="flex items-center gap-3 overflow-hidden">
          <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white shrink-0 font-bold text-xl">
            S
          </div>
          <span *ngIf="isSidebarOpen" class="text-xl font-black text-indigo-600 tracking-tight whitespace-nowrap">Sucursal</span>
        </div>
      </div>

      <!-- Navigation -->
      <ul class="space-y-2 flex-1">
        <li>
          <a routerLink="/gerente-sucursal/plantilla" routerLinkActive="bg-indigo-50 text-indigo-600 font-bold dark:bg-gray-700 dark:text-white" class="flex items-center p-3 text-base font-medium text-gray-700 rounded-lg hover:bg-gray-100 transition-colors group overflow-hidden">
            <svg class="w-6 h-6 shrink-0 transition-colors group-hover:text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
            <span *ngIf="isSidebarOpen" class="ml-4 whitespace-nowrap">Plantilla Local</span>
          </a>
        </li>
        <li>
          <a routerLink="/gerente-sucursal/configuracion" routerLinkActive="bg-indigo-50 text-indigo-600 font-bold dark:bg-gray-700 dark:text-white" class="flex items-center p-3 text-base font-medium text-gray-700 rounded-lg hover:bg-gray-100 transition-colors group overflow-hidden">
            <svg class="w-6 h-6 shrink-0 transition-colors group-hover:text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            <span *ngIf="isSidebarOpen" class="ml-4 whitespace-nowrap">Fechas (Local)</span>
          </a>
        </li>
        <li class="pt-4 mt-4 border-t border-gray-200">
           <span *ngIf="isSidebarOpen" class="px-3 text-xs font-bold text-gray-400 uppercase tracking-wider">Próximas Fases</span>
        </li>
        <li>
          <a routerLink="/gerente-sucursal/aprobaciones" routerLinkActive="bg-indigo-50 text-indigo-600 font-bold dark:bg-gray-700 dark:text-white" class="flex items-center p-3 text-base font-medium text-gray-700 rounded-lg hover:bg-gray-100 transition-colors group overflow-hidden">
            <svg class="w-6 h-6 shrink-0 transition-colors group-hover:text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span *ngIf="isSidebarOpen" class="ml-4 whitespace-nowrap">Aprobaciones Locales</span>
          </a>
        </li>
        <li>
          <a routerLink="/gerente-sucursal/reportes" routerLinkActive="bg-indigo-50 text-indigo-600 font-bold dark:bg-gray-700 dark:text-white" class="flex items-center p-3 text-base font-medium text-gray-700 rounded-lg hover:bg-gray-100 transition-colors group overflow-hidden">
            <svg class="w-6 h-6 shrink-0 transition-colors group-hover:text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            <span *ngIf="isSidebarOpen" class="ml-4 whitespace-nowrap">Reportes Locales</span>
          </a>
        </li>
      </ul>

      <!-- Footer / Profile -->
      <div class="mt-auto border-t border-gray-200 pt-4">
        <a (click)="logout()" class="cursor-pointer flex items-center p-3 text-base font-medium text-red-600 rounded-lg hover:bg-red-50 transition-colors overflow-hidden">
          <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
          <span *ngIf="isSidebarOpen" class="ml-4 font-bold">Cerrar Sesión</span>
        </a>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto bg-gray-50 dark:bg-gray-900 w-full relative h-screen">
    <div class="p-8">
      <router-outlet></router-outlet>
    </div>
  </main>

</div>
