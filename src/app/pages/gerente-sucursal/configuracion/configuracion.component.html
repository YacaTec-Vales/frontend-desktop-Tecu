<div class="max-w-4xl mx-auto space-y-6">
  
  <div>
    <h2 class="text-3xl font-bold text-gray-900 dark:text-white">Motor de Fechas (Local)</h2>
    <p class="text-gray-500 dark:text-gray-400 mt-1 text-lg">Define el ciclo de crédito para las relaciones generadas en tu sucursal.</p>
  </div>

  <app-card title="Actualizar Fechas" subtitle="Los cambios aplicarán al próximo corte de las distribuidoras asignadas.">
    <div class="space-y-6">
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <app-input label="Fecha de Corte (Sucursal)" type="date" [(ngModel)]="fechaCorte" hint="Día exacto donde se congelan los vales emitidos."></app-input>
        <app-input label="Fecha Límite de Pago (Sucursal)" type="date" [(ngModel)]="fechaPago" hint="Último día para que las distribuidoras realicen su pago."></app-input>
      </div>

      <div class="p-4 bg-yellow-50 border-l-4 border-yellow-400 text-yellow-800 rounded-md">
        <div class="flex">
          <div class="flex-shrink-0">
            <svg class="h-5 w-5 text-yellow-400" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
            </svg>
          </div>
          <div class="ml-3">
            <p class="text-sm font-medium">
              Impacto Local: Modificar estas fechas alterará la proyección de deudas de la sucursal activa.
            </p>
          </div>
        </div>
      </div>

      <!-- Alerta de Éxito Temporal -->
      <div *ngIf="guardado" class="p-4 bg-green-50 text-green-700 rounded-lg flex items-center gap-2 font-medium">
        <svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        Fechas locales guardadas exitosamente.
      </div>

      <div class="flex justify-end pt-4 border-t border-gray-100 dark:border-gray-700">
        <app-button variant="primary" (onClick)="guardarFechas()" [disabled]="!fechaCorte || !fechaPago">
          Guardar Cambios
        </app-button>
      </div>

    </div>
  </app-card>

</div>
