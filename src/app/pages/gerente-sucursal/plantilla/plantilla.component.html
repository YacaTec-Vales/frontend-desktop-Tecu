<div class="max-w-7xl mx-auto space-y-6">
  
  <div>
    <h2 class="text-3xl font-bold text-gray-900 dark:text-white">Plantilla Local</h2>
    <p class="text-gray-500 dark:text-gray-400 mt-1 text-lg">Directorio y gestión del personal asignado exclusivamente a tu sucursal.</p>
  </div>

  <app-card title="Personal Operativo" subtitle="Coordinadores, Verificadores y Cajeras." [noPadding]="true">
    <div class="p-4 flex justify-end border-b border-gray-100 dark:border-gray-700">
      <app-button variant="primary" (onClick)="abrirModal()">+ Registrar Empleado</app-button>
    </div>
    <app-table [columns]="['ID Empleado', 'Nombre Completo', 'Rol Asignado', 'Estado', 'Acciones']" [isEmpty]="personal.length === 0">
      <tr *ngFor="let emp of personal" class="bg-white border-b hover:bg-gray-50 transition-colors">
        <td class="px-6 py-4 font-bold text-gray-900">{{ emp.id }}</td>
        <td class="px-6 py-4">{{ emp.nombre }}</td>
        <td class="px-6 py-4"><app-badge [text]="emp.rol" variant="info"></app-badge></td>
        <td class="px-6 py-4">
          <app-badge [text]="emp.estado" [variant]="emp.estado === 'Activo' ? 'success' : 'default'"></app-badge>
        </td>
        <td class="px-6 py-4 flex gap-2">
          <app-button variant="text" size="sm">Editar</app-button>
          <app-button variant="text" size="sm" *ngIf="emp.estado === 'Activo'">Baja</app-button>
        </td>
      </tr>
    </app-table>
  </app-card>

</div>

<!-- Modal: Registrar Empleado -->
<app-modal [isOpen]="isModalOpen" title="Registrar Empleado (Local)" maxWidth="md" (onClose)="cerrarModal()">
  <div class="space-y-4">
    <div class="p-3 bg-blue-50 text-blue-800 text-sm rounded-lg border border-blue-200">
      Este empleado quedará vinculado automáticamente a tu sucursal.
    </div>

    <app-input label="Nombre Completo" type="text" placeholder="Ej: Laura Martínez" [(ngModel)]="nuevoEmpleado.nombre"></app-input>
    
    <!-- En un sistema real esto sería un app-select, lo simulamos con input -->
    <app-input label="Rol en Sucursal" type="text" hint="Valores permitidos: Coordinador, Verificador, Cajera" placeholder="Ej: Cajera" [(ngModel)]="nuevoEmpleado.rol"></app-input>
    
    <div class="mt-6 flex justify-end gap-2 pt-4 border-t border-gray-100">
      <app-button variant="text" (onClick)="cerrarModal()">Cancelar</app-button>
      <app-button variant="primary" (onClick)="guardarEmpleado()" [disabled]="!nuevoEmpleado.nombre || !nuevoEmpleado.rol">Registrar Empleado</app-button>
    </div>
  </div>
</app-modal>
